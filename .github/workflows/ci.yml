name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Quality (fmt + clippy)
    runs-on: [self-hosted, linux, x64, quality]

    steps:
      - uses: actions/checkout@v6

      - name: Configure shared cache
        run: |
          echo "CARGO_HOME=/opt/github-runners/cache/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/github-runners/cache/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=/opt/github-runners/cache/target" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=/opt/github-runners/cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=/opt/github-runners/cache/bun" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=/opt/github-runners/cache/npm" >> "$GITHUB_ENV"
          echo "PNPM_STORE_DIR=/opt/github-runners/cache/pnpm" >> "$GITHUB_ENV"
          echo "DENO_DIR=/opt/github-runners/cache/deno" >> "$GITHUB_ENV"
          echo "/opt/github-runners/cache/cargo/bin" >> "$GITHUB_PATH"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Start sccache
        run: |
          sccache --start-server || true
          sccache --zero-stats

      - name: Install npm dependencies
        run: make install

      - name: Format check
        run: make fmt-check

      - name: Clippy
        run: make clippy

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

  test:
    name: Test
    runs-on: [self-hosted, linux, x64, ci]

    steps:
      - uses: actions/checkout@v6

      - name: Configure shared cache
        run: |
          echo "CARGO_HOME=/opt/github-runners/cache/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/github-runners/cache/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=/opt/github-runners/cache/target" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=/opt/github-runners/cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=/opt/github-runners/cache/bun" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=/opt/github-runners/cache/npm" >> "$GITHUB_ENV"
          echo "PNPM_STORE_DIR=/opt/github-runners/cache/pnpm" >> "$GITHUB_ENV"
          echo "DENO_DIR=/opt/github-runners/cache/deno" >> "$GITHUB_ENV"
          echo "/opt/github-runners/cache/cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: |
          sccache --start-server || true
          sccache --zero-stats

      - name: Run tests
        run: make test

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

  audit:
    name: Security Audit
    runs-on: [self-hosted, linux, x64, audit]

    steps:
      - uses: actions/checkout@v6

      - name: Configure shared cache
        run: |
          echo "CARGO_HOME=/opt/github-runners/cache/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/github-runners/cache/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=/opt/github-runners/cache/target" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=/opt/github-runners/cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=/opt/github-runners/cache/bun" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=/opt/github-runners/cache/npm" >> "$GITHUB_ENV"
          echo "PNPM_STORE_DIR=/opt/github-runners/cache/pnpm" >> "$GITHUB_ENV"
          echo "DENO_DIR=/opt/github-runners/cache/deno" >> "$GITHUB_ENV"
          echo "/opt/github-runners/cache/cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: |
          sccache --start-server || true
          sccache --zero-stats

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run audit
        run: make audit

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

  coverage:
    name: Coverage
    runs-on: [self-hosted, linux, x64, coverage]

    steps:
      - uses: actions/checkout@v6

      - name: Configure shared cache
        run: |
          echo "CARGO_HOME=/opt/github-runners/cache/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/github-runners/cache/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=/opt/github-runners/cache/target" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=/opt/github-runners/cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=/opt/github-runners/cache/bun" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=/opt/github-runners/cache/npm" >> "$GITHUB_ENV"
          echo "PNPM_STORE_DIR=/opt/github-runners/cache/pnpm" >> "$GITHUB_ENV"
          echo "DENO_DIR=/opt/github-runners/cache/deno" >> "$GITHUB_ENV"
          echo "/opt/github-runners/cache/cargo/bin" >> "$GITHUB_PATH"

      - name: Start sccache
        run: |
          sccache --start-server || true
          sccache --zero-stats

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: make coverage

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage.md ]; then
            {
              echo "## Coverage"
              echo
              cat coverage.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.md
            lcov.info
            cobertura.xml
            html/
          if-no-files-found: warn

      - name: sccache statistics
        if: always()
        run: sccache --show-stats
