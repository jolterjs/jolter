name: Provider Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  install-linux-selfhosted:
    name: Providers (self-hosted Linux)
    runs-on: [self-hosted, linux, ci]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test
        shell: bash
        run: |
          set -e

          exe="./target/release/jolter"
          export JOLTER_HOME="$RUNNER_TEMP/jolter-home"

          "$exe" use node@lts
          "$exe" use bun@latest
          "$exe" use deno@latest

          project="$RUNNER_TEMP/jolter-smoke-project"
          mkdir -p "$project"

          cat > "$project/jolter.json" << 'EOF'
{
  "schemaVersion": 1,
  "runtime": { "node": "lts" },
  "tools": { "pnpm": "latest" }
}
EOF

          cd "$project"

          "$exe" setup-ci --json

          shim="$JOLTER_HOME/shims"

          "$shim/node" --version
          "$shim/pnpm" --version

  install-windows:
    name: Providers (Windows)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

  install-macos:
    name: Providers (macOS)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked