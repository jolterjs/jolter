name: Provider Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  install-linux-selfhosted:
    name: Providers (Linux)
    runs-on: [self-hosted, linux, smoke]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test (Linux)
        shell: bash
        run: |
          set -e

          exe="./target/release/jolter"
          shim_exe="./target/release/jolter-shim"
          test -x "$shim_exe"
          export JOLTER_HOME="$RUNNER_TEMP/jolter-home"

          "$exe" use node@lts
          "$exe" use bun@latest
          "$exe" use deno@latest

          project="$RUNNER_TEMP/jolter-smoke-project"
          mkdir -p "$project"

          cat > "$project/jolter.json" << 'EOF'
          {
            "$schema": "https://schemas.jolter.dev/project/v2/schema.json",
            "schemaVersion": 2,
            "runtime": { "node": "lts" },
            "tools": { "pnpm": "latest" }
          }
          EOF

          cd "$project"

          "$exe" setup-ci --json

          shim="$JOLTER_HOME/shims"

          "$shim/node" --version
          "$shim/pnpm" --version

  install-windows:
    name: Providers (Windows)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path $PWD "target/release/jolter.exe"
          $shimExe = Join-Path $PWD "target/release/jolter-shim.exe"
          if (-not (Test-Path $shimExe)) { throw "missing jolter-shim.exe" }
          $env:JOLTER_HOME = Join-Path $env:RUNNER_TEMP "jolter-home"

          & $exe use node@lts
          & $exe use bun@latest
          & $exe use deno@latest

          $project = Join-Path $env:RUNNER_TEMP "jolter-smoke-project"
          New-Item -ItemType Directory -Force $project | Out-Null

          @'
          {
            "$schema": "https://schemas.jolter.dev/project/v2/schema.json",
            "schemaVersion": 2,
            "runtime": { "node": "lts" },
            "tools": { "pnpm": "latest" }
          }
          '@ | Set-Content (Join-Path $project "jolter.json")

          Push-Location $project
          try {
            & $exe setup-ci --json

            $shim = Join-Path $env:JOLTER_HOME "shims"

            & (Join-Path $shim "node.exe") --version
            & (Join-Path $shim "pnpm.exe") --version
          } finally {
            Pop-Location
          }

  install-macos:
    name: Providers (macOS)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Smoke test (macOS)
        shell: bash
        run: |
          set -e

          exe="./target/release/jolter"
          shim_exe="./target/release/jolter-shim"
          test -x "$shim_exe"
          export JOLTER_HOME="$RUNNER_TEMP/jolter-home"

          "$exe" use node@lts
          "$exe" use bun@latest
          "$exe" use deno@latest

          project="$RUNNER_TEMP/jolter-smoke-project"
          mkdir -p "$project"

          cat > "$project/jolter.json" << 'EOF'
          {
            "$schema": "https://schemas.jolter.dev/project/v2/schema.json",
            "schemaVersion": 2,
            "runtime": { "node": "lts" },
            "tools": { "pnpm": "latest" }
          }
          EOF

          cd "$project"

          "$exe" setup-ci --json

          shim="$JOLTER_HOME/shims"

          "$shim/node" --version
          "$shim/pnpm" --version
