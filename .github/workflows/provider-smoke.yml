name: Provider Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  install-linux-selfhosted:
    name: Providers (Linux)
    runs-on: [self-hosted, linux, x64, smoke]

    steps:
      - uses: actions/checkout@v6

      - name: Configure shared cache
        run: |
          echo "CARGO_HOME=/opt/github-runners/cache/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/github-runners/cache/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=/opt/github-runners/cache/target" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=/opt/github-runners/cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=/opt/github-runners/cache/bun" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=/opt/github-runners/cache/npm" >> "$GITHUB_ENV"
          echo "PNPM_STORE_DIR=/opt/github-runners/cache/pnpm" >> "$GITHUB_ENV"
          echo "DENO_DIR=/opt/github-runners/cache/deno" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Start sccache
        run: |
          sccache --start-server || true
          sccache --zero-stats

      - name: Build release
        run: make build-release

      - name: Smoke test (Linux)
        shell: bash
        run: |
          set -e

          exe="./target/release/jolter"
          shim_exe="./target/release/jolter-shim"
          test -x "$shim_exe"
          export JOLTER_HOME="$RUNNER_TEMP/jolter-home"

          "$exe" use node@lts
          "$exe" use bun@latest
          "$exe" use deno@latest

          project="$RUNNER_TEMP/jolter-smoke-project"
          mkdir -p "$project"

          cat > "$project/jolter.json" << 'EOF'
          {
            "$schema": "https://schemas.jolter.dev/project/v2/schema.json",
            "schemaVersion": 2,
            "runtime": { "node": "lts" },
            "tools": { "pnpm": "latest" }
          }
          EOF

          cd "$project"

          "$exe" setup-ci --json

          shim="$JOLTER_HOME/shims"

          "$shim/node" --version
          "$shim/pnpm" --version

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

  install-windows:
    name: Providers (Windows)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: make build-release

      - name: Smoke test (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path $PWD "target/release/jolter.exe"
          $shimExe = Join-Path $PWD "target/release/jolter-shim.exe"
          if (-not (Test-Path $shimExe)) { throw "missing jolter-shim.exe" }
          $env:JOLTER_HOME = Join-Path $env:RUNNER_TEMP "jolter-home"

          & $exe use node@lts
          & $exe use bun@latest
          & $exe use deno@latest

          $project = Join-Path $env:RUNNER_TEMP "jolter-smoke-project"
          New-Item -ItemType Directory -Force $project | Out-Null

          @'
          {
            "$schema": "https://schemas.jolter.dev/project/v2/schema.json",
            "schemaVersion": 2,
            "runtime": { "node": "lts" },
            "tools": { "pnpm": "latest" }
          }
          '@ | Set-Content (Join-Path $project "jolter.json")

          Push-Location $project
          try {
            & $exe setup-ci --json

            $shim = Join-Path $env:JOLTER_HOME "shims"

            & (Join-Path $shim "node.exe") --version
            & (Join-Path $shim "pnpm.exe") --version
          } finally {
            Pop-Location
          }

  install-macos:
    name: Providers (macOS)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: make build-release

      - name: Smoke test (macOS)
        shell: bash
        run: |
          set -e

          exe="./target/release/jolter"
          shim_exe="./target/release/jolter-shim"
          test -x "$shim_exe"
          export JOLTER_HOME="$RUNNER_TEMP/jolter-home"

          "$exe" use node@lts
          "$exe" use bun@latest
          "$exe" use deno@latest

          project="$RUNNER_TEMP/jolter-smoke-project"
          mkdir -p "$project"

          cat > "$project/jolter.json" << 'EOF'
          {
            "$schema": "https://schemas.jolter.dev/project/v2/schema.json",
            "schemaVersion": 2,
            "runtime": { "node": "lts" },
            "tools": { "pnpm": "latest" }
          }
          EOF

          cd "$project"

          "$exe" setup-ci --json

          shim="$JOLTER_HOME/shims"

          "$shim/node" --version
          "$shim/pnpm" --version
