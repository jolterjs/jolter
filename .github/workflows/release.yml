name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: [self-hosted, linux, x64, release]
            target: x86_64-unknown-linux-gnu
            archive: tar
            self-hosted: true

          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
            self-hosted: false

          - runs-on: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
            self-hosted: false

          - runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            self-hosted: false

          - runs-on: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
            self-hosted: false

          - runs-on: macos-15
            target: aarch64-apple-darwin
            archive: tar
            self-hosted: false

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure shared cache (self-hosted)
        if: matrix.self-hosted
        run: |
          echo "CARGO_HOME=/opt/github-runners/cache/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=/opt/github-runners/cache/rustup" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=/opt/github-runners/cache/target" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=/opt/github-runners/cache/sccache" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=/opt/github-runners/cache/bun" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=/opt/github-runners/cache/npm" >> "$GITHUB_ENV"
          echo "PNPM_STORE_DIR=/opt/github-runners/cache/pnpm" >> "$GITHUB_ENV"
          echo "DENO_DIR=/opt/github-runners/cache/deno" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: ${{ !matrix.self-hosted }}
        uses: Swatinem/rust-cache@v2

      - name: Start sccache
        if: matrix.self-hosted
        run: |
          sccache --start-server || true
          sccache --zero-stats

      - name: Build release
        run: make build-release ARGS="--target ${{ matrix.target }}"

      - name: sccache statistics
        if: ${{ always() && matrix.self-hosted }}
        run: sccache --show-stats

      - name: Package Unix artifact
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail

          name="jolter-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"

          cp "target/${{ matrix.target }}/release/jolter" \
            "target/${{ matrix.target }}/release/jolter-shim" \
            README.md LICENSE "dist/$name/"

          test -x "dist/$name/jolter"
          test -x "dist/$name/jolter-shim"

          tar -C dist -czf "dist/$name.tar.gz" "$name"

          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - name: Code Sign Windows Binaries
        if: matrix.archive == 'zip' && env.WINDOWS_CODESIGN_CERTIFICATE_BASE64 != ''
        env:
          WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import(
            $certBytes,
            $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          )

          Set-AuthenticodeSignature `
            -FilePath "target/${{ matrix.target }}/release/jolter.exe" `
            -Certificate $cert `
            -TimestampServer "http://timestamp.digicert.com"

          Set-AuthenticodeSignature `
            -FilePath "target/${{ matrix.target }}/release/jolter-shim.exe" `
            -Certificate $cert `
            -TimestampServer "http://timestamp.digicert.com"

      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "jolter-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/jolter.exe", `
            "target/${{ matrix.target }}/release/jolter-shim.exe", `
            "README.md", `
            "LICENSE" `
            $dir

          if (-not (Test-Path (Join-Path $dir "jolter.exe"))) {
            throw "missing jolter.exe"
          }

          if (-not (Test-Path (Join-Path $dir "jolter-shim.exe"))) {
            throw "missing jolter-shim.exe"
          }

          $zip = "dist/$name.zip"
          Compress-Archive "$dir/*" $zip

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: jolter-${{ matrix.target }}
          path: dist/*
