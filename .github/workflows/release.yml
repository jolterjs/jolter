name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix artifact
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          name="jolter-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/jolter" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          else
            shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
          fi
      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "jolter-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $directory = Join-Path "dist" $name
          New-Item -ItemType Directory -Force $directory | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/jolter.exe", "README.md", "LICENSE" $directory
          $archive = "dist/$name.zip"
          Compress-Archive -Path "$directory/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: jolter-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jolter-*
          path: dist
          merge-multiple: true

      - name: Detect release type
        id: release_type
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"

          if [[ "$tag" =~ -rc\.?[0-9]*$ || "$tag" =~ -rc\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.JOLTERBOT_TOKEN }}
          generate_release_notes: true
          prerelease: ${{ steps.release_type.outputs.prerelease }}
          make_latest: ${{ steps.release_type.outputs.make_latest }}
          files: dist/*
