name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: [self-hosted, linux, x64, release]
            target: x86_64-unknown-linux-gnu
            archive: tar

          - runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar

          - runs-on: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

          - runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip

          - runs-on: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar

          - runs-on: macos-15
            target: aarch64-apple-darwin
            archive: tar

    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail

          name="jolter-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"

          cp "target/${{ matrix.target }}/release/jolter" \
            "target/${{ matrix.target }}/release/jolter-shim" \
            README.md LICENSE "dist/$name/"

          test -x "dist/$name/jolter"
          test -x "dist/$name/jolter-shim"

          tar -C dist -czf "dist/$name.tar.gz" "$name"

          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - name: Code Sign Windows Binaries
        if: matrix.archive == 'zip' && env.WINDOWS_CODESIGN_CERTIFICATE_BASE64 != ''
        env:
          WINDOWS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
          WINDOWS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERTIFICATE_BASE64)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($certBytes, $env:WINDOWS_CODESIGN_CERTIFICATE_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
          Set-AuthenticodeSignature -FilePath "target/${{ matrix.target }}/release/jolter.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com"
          Set-AuthenticodeSignature -FilePath "target/${{ matrix.target }}/release/jolter-shim.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com"

      - name: Package Windows artifact
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "jolter-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/jolter.exe", "target/${{ matrix.target }}/release/jolter-shim.exe", "README.md", "LICENSE" $dir

          if (-not (Test-Path (Join-Path $dir "jolter.exe"))) { throw "missing jolter.exe" }
          if (-not (Test-Path (Join-Path $dir "jolter-shim.exe"))) { throw "missing jolter-shim.exe" }

          $zip = "dist/$name.zip"
          Compress-Archive "$dir/*" $zip

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: jolter-${{ matrix.target }}
          path: dist/*
