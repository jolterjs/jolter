[workspace]
members = [
    "crates/cli",
    "crates/config",
    "crates/core",
    "crates/doctor",
    "crates/installer",
    "crates/plugin",
    "crates/resolver",
    "crates/runtime",
    "crates/shim",
    "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jolterjs/jolter"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
flate2 = "1.1"
fs4 = "1.1"
nodejs-semver = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
wasmtime = { version = "36.0.8", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
zip = { version = "6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
inquire = "0.9.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
